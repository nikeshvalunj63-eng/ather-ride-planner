
name: Build EV Ride Planner APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ev-ride-planner-nov-16-2026-6-10-45-am.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          mkdir -p source

          unzip -q \
            ev-ride-planner-nov-16-2026-6-10-45-am.zip \
            -d source

          test -f source/settings.gradle.kts
          test -f source/build.gradle.kts
          test -f source/app/build.gradle.kts
          test -f source/app/google-services.json

      - name: Verify project configuration
        run: |
          echo "Gradle version:"
          grep distributionUrl source/gradle/wrapper/gradle-wrapper.properties

          echo "Android SDK configuration:"
          grep -E 'compileSdk|targetSdk|minSdk' source/app/build.gradle.kts

          echo "KSP version:"
          grep googleDevtoolsKsp source/gradle/libs.versions.toml

      - name: Generate debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore source/debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: |
          gradle -p source :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully generated!"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ev-ride-planner-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
